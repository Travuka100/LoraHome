; PlatformIO Project Configuration File
;
;   LoraHome telemetry: SENDER (2x DS18B20, mains power) and
;                       RECEIVER (LoRa request/response, battery, OLED).
;
;   Build sender : pio run -e sender
;   Build receiver: pio run -e receiver
;
; https://docs.platformio.org/page/projectconf.html

[base]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
     paulstoffregen/OneWire @ ^2.3.8
     milesburton/DallasTemperature @ ^3.9.1
     olikraus/U8g2@^2.34.13
     jgromes/RadioLib @ ^6.6.0
check_tool = clangtidy
check_patterns =
     src/*.cpp
     src/*.h
     lib/LoraHome/*.h
     lib/Sensors/*.cpp
     lib/Sensors/*.h
     lib/Board/*.cpp
     lib/Board/*.h
check_flags =
     clangtidy: --checks=*,bugprone-*,cert-*,clang-analyzer-*,cppcoreguidelines-*,modernize-*,performance-*,portability-*,readability-*,-modernize-use-trailing-return-type,-llvmlibc-*,-altera-*,-fuchsia-*

[env:sender]
extends = base
build_src_filter = +<*> -<receiver.cpp>

[env:receiver]
extends = base
build_src_filter = +<*> -<sender.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

test_build_src = no
